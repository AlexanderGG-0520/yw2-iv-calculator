apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yw2-iv-calculator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AlexanderGG-0520/yw2-iv-calculator.git
    targetRevision: main
    path: infra/kubernetes
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: yw2-iv-calculator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
